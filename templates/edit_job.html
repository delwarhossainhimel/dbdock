{% extends "base.html" %}

{% block content %}
{% set schedule_config = job.normalized_schedule_config %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5>Edit Backup Job</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('update_job', job_id=job.id) }}">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" name="name" value="{{ job.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description">{{ job.description }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Database Server</label>
                        <select class="form-select" name="database_server" id="database_server" required>
                            <option value="">Select a server</option>
                            {% for server in servers %}
                            <option value="{{ server.id }}" {% if server.id == job.database_server_id %}selected{% endif %}>
                                {{ server.name }} ({{ server.type.value }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Databases</label>
                        <div id="database-list" class="border p-2 rounded" style="max-height: 200px; overflow-y: auto;">
                            <p class="text-center text-muted mb-0">Select a database server first</p>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Storage Location</label>
                        <select class="form-select" name="storage_location" required>
                            <option value="">Select a storage location</option>
                            {% for location in locations %}
                            <option value="{{ location.id }}" {% if location.id == job.storage_location_id %}selected{% endif %}>
                                {{ location.name }} ({{ location.type.value }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Folder Path</label>
                        <input type="text" class="form-control" name="folder_path" value="{{ job.folder_path }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Schedules</label>
                        <div class="border rounded p-3">
                            <div class="form-check mb-3">
                                <input class="form-check-input schedule-toggle" type="checkbox" name="schedule_types" value="daily" id="schedule-daily" {% if schedule_config.daily.enabled %}checked{% endif %}>
                                <label class="form-check-label fw-semibold" for="schedule-daily">Daily</label>
                            </div>
                            <div class="schedule-option ps-4 pb-3" data-schedule="daily" {% if not schedule_config.daily.enabled %}style="display: none;"{% endif %}>
                                <label class="form-label">Daily Time</label>
                                <input type="time" class="form-control" name="daily_time" value="{{ schedule_config.daily.time }}">
                                <label class="form-label mt-3">Daily Retention</label>
                                <input type="number" class="form-control" name="daily_retention" min="1" value="{{ schedule_config.daily.retention }}">
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input schedule-toggle" type="checkbox" name="schedule_types" value="weekly" id="schedule-weekly" {% if schedule_config.weekly.enabled %}checked{% endif %}>
                                <label class="form-check-label fw-semibold" for="schedule-weekly">Weekly</label>
                            </div>
                            <div class="schedule-option ps-4 pb-3" data-schedule="weekly" {% if not schedule_config.weekly.enabled %}style="display: none;"{% endif %}>
                                <label class="form-label">Day of Week</label>
                                <select class="form-select mb-3" name="weekly_day">
                                    <option value="0" {% if schedule_config.weekly.day == '0' %}selected{% endif %}>Sunday</option>
                                    <option value="1" {% if schedule_config.weekly.day == '1' %}selected{% endif %}>Monday</option>
                                    <option value="2" {% if schedule_config.weekly.day == '2' %}selected{% endif %}>Tuesday</option>
                                    <option value="3" {% if schedule_config.weekly.day == '3' %}selected{% endif %}>Wednesday</option>
                                    <option value="4" {% if schedule_config.weekly.day == '4' %}selected{% endif %}>Thursday</option>
                                    <option value="5" {% if schedule_config.weekly.day == '5' %}selected{% endif %}>Friday</option>
                                    <option value="6" {% if schedule_config.weekly.day == '6' %}selected{% endif %}>Saturday</option>
                                </select>
                                <label class="form-label">Weekly Time</label>
                                <input type="time" class="form-control" name="weekly_time" value="{{ schedule_config.weekly.time }}">
                                <label class="form-label mt-3">Weekly Retention</label>
                                <input type="number" class="form-control" name="weekly_retention" min="1" value="{{ schedule_config.weekly.retention }}">
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input schedule-toggle" type="checkbox" name="schedule_types" value="monthly" id="schedule-monthly" {% if schedule_config.monthly.enabled %}checked{% endif %}>
                                <label class="form-check-label fw-semibold" for="schedule-monthly">Monthly</label>
                            </div>
                            <div class="schedule-option ps-4 pb-3" data-schedule="monthly" {% if not schedule_config.monthly.enabled %}style="display: none;"{% endif %}>
                                <label class="form-label">Day of Month</label>
                                <input type="number" class="form-control mb-3" name="monthly_day" min="1" max="31" value="{{ schedule_config.monthly.day }}">
                                <label class="form-label">Monthly Time</label>
                                <input type="time" class="form-control" name="monthly_time" value="{{ schedule_config.monthly.time }}">
                                <label class="form-label mt-3">Monthly Retention</label>
                                <input type="number" class="form-control" name="monthly_retention" min="1" value="{{ schedule_config.monthly.retention }}">
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input schedule-toggle" type="checkbox" name="schedule_types" value="yearly" id="schedule-yearly" {% if schedule_config.yearly.enabled %}checked{% endif %}>
                                <label class="form-check-label fw-semibold" for="schedule-yearly">Yearly</label>
                            </div>
                            <div class="schedule-option ps-4" data-schedule="yearly" {% if not schedule_config.yearly.enabled %}style="display: none;"{% endif %}>
                                <label class="form-label">Month</label>
                                <select class="form-select mb-3" name="yearly_month">
                                    {% for month_number, month_name in [('1', 'January'), ('2', 'February'), ('3', 'March'), ('4', 'April'), ('5', 'May'), ('6', 'June'), ('7', 'July'), ('8', 'August'), ('9', 'September'), ('10', 'October'), ('11', 'November'), ('12', 'December')] %}
                                    <option value="{{ month_number }}" {% if schedule_config.yearly.month == month_number %}selected{% endif %}>{{ month_name }}</option>
                                    {% endfor %}
                                </select>
                                <label class="form-label">Day of Month</label>
                                <input type="number" class="form-control mb-3" name="yearly_day" min="1" max="31" value="{{ schedule_config.yearly.day }}">
                                <label class="form-label">Yearly Time</label>
                                <input type="time" class="form-control" name="yearly_time" value="{{ schedule_config.yearly.time }}">
                                <label class="form-label mt-3">Yearly Retention</label>
                                <input type="number" class="form-control" name="yearly_retention" min="1" value="{{ schedule_config.yearly.retention }}">
                            </div>
                        </div>
                        <div class="form-text">One job can keep any combination of daily, weekly, monthly, and yearly schedules.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notification Email</label>
                        <div class="input-group">
                            <input type="email" class="form-control" name="notification_email" id="notification_email" value="{{ job.notification_email }}">
                            <button type="button" class="btn btn-outline-primary" id="send-test-email">Send Test Email</button>
                        </div>
                        <!-- <div class="form-text">Uses the SMTP settings from `.env` and sends to this receiver email.</div> -->
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('backup_jobs') }}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Update Job</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const serverSelect = document.getElementById('database_server');
    const databaseList = document.getElementById('database-list');
    const selectedDatabases = {{ selected_databases | tojson }};

    function attachSelectAllHandler(container) {
        const selectAll = container.querySelector('#select-all');
        if (!selectAll) {
            return;
        }

        selectAll.addEventListener('click', function() {
            const checkboxes = container.querySelectorAll('input[type="checkbox"][name="databases"]');
            checkboxes.forEach((checkbox) => {
                checkbox.checked = this.checked;
            });
        });
    }

    function loadDatabases(serverId) {
        if (!serverId) {
            databaseList.innerHTML = '<p class="text-center text-muted mb-0">Select a database server first</p>';
            return;
        }

        databaseList.innerHTML = '<div class="text-center my-3"><div class="spinner-border" role="status"></div></div>';

        fetch(`/get_databases/${serverId}`)
            .then((response) => response.json())
            .then((data) => {
                if (!data.success) {
                    databaseList.innerHTML = `<div class="alert alert-danger mb-0">${data.message}</div>`;
                    return;
                }

                databaseList.innerHTML = '';

                data.databases.forEach((db) => {
                    const checkbox = document.createElement('div');
                    checkbox.className = 'form-check';
                    const isChecked = selectedDatabases.includes(db);
                    checkbox.innerHTML = `
                        <input class="form-check-input" type="checkbox" name="databases" value="${db}" id="db-${db}" ${isChecked ? 'checked' : ''}>
                        <label class="form-check-label" for="db-${db}">${db}</label>
                    `;
                    databaseList.appendChild(checkbox);
                });

                const selectAll = document.createElement('div');
                selectAll.className = 'form-check mt-2';
                selectAll.innerHTML = `
                    <input class="form-check-input" type="checkbox" id="select-all">
                    <label class="form-check-label fw-bold" for="select-all">Select All</label>
                `;
                databaseList.appendChild(selectAll);
                attachSelectAllHandler(databaseList);
            });
    }

    if (serverSelect) {
        loadDatabases(serverSelect.value);
        serverSelect.addEventListener('change', function() {
            loadDatabases(this.value);
        });
    }

    document.querySelectorAll('.schedule-toggle').forEach((toggle) => {
        const scheduleName = toggle.value;
        const panel = document.querySelector(`.schedule-option[data-schedule="${scheduleName}"]`);

        const syncPanel = () => {
            if (panel) {
                panel.style.display = toggle.checked ? 'block' : 'none';
            }
        };

        toggle.addEventListener('change', syncPanel);
        syncPanel();
    });

    const testEmailButton = document.getElementById('send-test-email');
    const notificationEmailInput = document.getElementById('notification_email');

    if (testEmailButton && notificationEmailInput) {
        testEmailButton.addEventListener('click', function() {
            const email = notificationEmailInput.value.trim();

            if (!email) {
                alert('Enter a notification email first.');
                return;
            }

            this.disabled = true;
            this.textContent = 'Sending...';

            fetch('/test_email', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email }),
            })
            .then((response) => response.json())
            .then((data) => {
                alert(data.message);
            })
            .catch((error) => {
                alert('Error: ' + error);
            })
            .finally(() => {
                this.disabled = false;
                this.textContent = 'Send Test Email';
            });
        });
    }
});
</script>
{% endblock %}
